# Mosquitto produksi untuk Tandurai. Aturan sama dengan broker uji (src/brokerAcl.js).
listener 1883
# Untuk akses dari internet gunakan TLS (listener 8883 + certfile/keyfile) dan tutup 1883 di firewall.

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# clientId wajib sama dengan username (hwUid) agar sesi & LWT tidak bisa dibajak.
use_username_as_clientid true

persistence true
persistence_location /mosquitto/data/
# Antrean QoS1 untuk perangkat yang offline (command kedaluwarsa tetap ditolak perangkat).
max_queued_messages 100
log_dest stdout
