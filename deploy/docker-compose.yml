# Tandurai dalam satu VM: dashboard + API + broker MQTT + PostgreSQL + AI worker.
# Jalankan dari folder deploy/:  ./deploy.sh   (atau: docker compose up -d --build)
# Semua nilai diambil dari deploy/.env (salin dari .env.example).
name: tandurai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  NODE_ENV: production
  PORT: "8787"
  DATABASE_URL: postgres://tandurai:${POSTGRES_PASSWORD}@postgres:5432/tandurai_iot
  MQTT_URL: mqtt://broker:1883
  MQTT_BROKER_PORT: "1883"
  MQTT_USERNAME: tandurai-backend
  MQTT_PASSWORD: ${MQTT_PASSWORD:?isi MQTT_PASSWORD di deploy/.env}
  MQTT_CLIENT_ID: tandurai-backend
  MQTT_PUBLIC_HOST: ${MQTT_DOMAIN}
  MQTT_PUBLIC_PORT: "8883"
  MQTT_PUBLIC_TLS: "true"
  AUTH_MODE: firebase
  FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?isi VITE_FIREBASE_PROJECT_ID di deploy/.env}
  CORS_ORIGINS: https://${DASHBOARD_DOMAIN}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  WORKER_TOKEN: ${WORKER_TOKEN:?isi WORKER_TOKEN di deploy/.env}
  HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-180}
  OFFLINE_AFTER_SEC: ${OFFLINE_AFTER_SEC:-180}
  TZ: Asia/Jakarta

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tandurai_iot
      POSTGRES_USER: tandurai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandurai -d tandurai_iot"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *logging

  broker:
    # Image dibangun oleh service "api".
    image: tandurai-api:latest
    pull_policy: never
    command: ["broker-entrypoint"]
    restart: unless-stopped
    environment:
      <<: *api-env
      MQTT_TLS_PORT: "8883"
      # Sertifikat Let's Encrypt yang diambil Caddy untuk MQTT_DOMAIN (dibaca dari volume caddy-data).
      MQTT_TLS_CERT: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MQTT_DOMAIN}/${MQTT_DOMAIN}.crt
      MQTT_TLS_KEY: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MQTT_DOMAIN}/${MQTT_DOMAIN}.key
    volumes:
      - caddy-data:/caddy-data:ro
    ports:
      - "8883:8883"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: tandurai-api:latest
    command: ["node", "apps/api/src/server.js"]
    user: node
    restart: unless-stopped
    environment: *api-env
    networks:
      default:
        # Nama unik untuk Caddy: container web juga bisa ikut network bersama yang mungkin punya service "api" lain.
        aliases:
          - tandurai-api
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>r.json()).then(b=>process.exit(b.db?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging: *logging

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    image: tandurai-worker:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE: api
      BACKEND_URL: http://api:8787/api
      WORKER_TOKEN: ${WORKER_TOKEN}
      TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
    volumes:
      - worker-runtime:/app/local_ai_worker/runtime
    depends_on:
      api:
        condition: service_started
    mem_limit: 768m
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
        VITE_CHAT_API_URL: ${VITE_CHAT_API_URL:-}
        VITE_API_URL: https://${DASHBOARD_DOMAIN}/api
    image: tandurai-web:latest
    restart: unless-stopped
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?isi DASHBOARD_DOMAIN di deploy/.env}
      # Alamat situs dashboard di Caddyfile; docker-compose.npm.yml menggantinya ke http:// di belakang NPM.
      DASHBOARD_SITE: ${DASHBOARD_DOMAIN}
      MQTT_DOMAIN: ${MQTT_DOMAIN:?isi MQTT_DOMAIN di deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?isi ACME_EMAIL di deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    mem_limit: 256m
    logging: *logging

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  worker-runtime:
