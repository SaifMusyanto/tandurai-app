[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tandurai-local-ai-worker"
version = "0.1.0"
description = "Local Firebase worker for TANDURAI harvest forecasting"
requires-python = ">=3.11,<3.14"  # scikit-learn 1.8.0 butuh ≥ 3.11
dependencies = [
  "firebase-admin>=6,<8",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "python-dotenv>=1,<2",
  "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tandurai-worker = "worker.commands:main"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
